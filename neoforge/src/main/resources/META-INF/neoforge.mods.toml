modLoader="javafml"
loaderVersion="[4,)"
license="GPL-3.0"
issueTrackerURL="https://github.com/FrozenBlock/FrozenLib/issues"

[[mixins]]
config="mixin/frozenlib.advancement.mixins.json"

[[mixins]]
config="mixin/frozenlib.gravity.mixins.json"

[[mixins]]
config="mixin/frozenlib.loot.mixins.json"

[[mixins]]
config="mixin/frozenlib.loot.neoforge.mixins.json"

[[mixins]]
    config="mixin/frozenlib.screenshake.mixins.json"

[[mods]]
    modId="frozenlib"
    version="${mod_version}"
    displayName="FrozenLib"
    displayURL="https://www.modrinth.com/mod/FrozenLib"
    logoFile="assets/frozenlib/icon.png"
    authors="Ethan Stokes, Luna"
    description='''
A library that contains many tools for modders.
Includes advanced math operations, noise sampling, advanced sounds, entity texture overrides,
structure pool element replacements, item cooldown changes, datafixers, syncable configs, and much more!
Provides a NeoForge implementation of QuiltMC's DataFixerUpper API.
    '''

[[ dependencies.frozenlib ]]
    modId="neoforge"
    type="required"
    versionRange="[~26.2-,)"
    ordering="NONE"
    side="BOTH"

[[ dependencies.frozenlib ]]
    modId="minecraft"
    type="required"
    versionRange="[~26.2-,)"
    ordering="NONE"
    side="BOTH"
