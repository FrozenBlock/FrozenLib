modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="${issues_url}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="${mod_url}"
    iconFile="assets/frozenlib/icon.png"
    authors="AViewFromTheTop/Lunade, Ethan Stokes"
    description='''
FrozenBlock's library mod, providing countless useful APIs and features for mod development.
    '''

[[mixins]]
config="mixin/frozenlib.advancement.mixins.json"

[[mixins]]
config="mixin/frozenlib.block.mixins.json"

[[mixins]]
config="mixin/frozenlib.block.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.cape.mixins.json"

[[mixins]]
config="mixin/frozenlib.clothconfig.mixins.json"
requiredMods=["cloth_config"]

[[mixins]]
config="mixin/frozenlib.core.mixins.json"

[[mixins]]
config="mixin/frozenlib.debug.mixins.json"

[[mixins]]
config="mixin/frozenlib.data_attachment.mixins.json"

[[mixins]]
config="mixin/frozenlib.entity.mixins.json"

[[mixins]]
config="mixin/frozenlib.entity.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.event.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.feature_flag.mixins.json"

[[mixins]]
config="mixin/frozenlib.gravity.mixins.json"

[[mixins]]
config="mixin/frozenlib.item.mixins.json"

[[mixins]]
config="mixin/frozenlib.item.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.levelgen.attribute.mixins.json"

[[mixins]]
config="mixin/frozenlib.levelgen.biome.mixins.json"

[[mixins]]
config="mixin/frozenlib.levelgen.structure.mixins.json"

[[mixins]]
config="mixin/frozenlib.levelgen.material.mixins.json"

[[mixins]]
config="mixin/frozenlib.loot.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.menu.mixins.json"

[[mixins]]
config="mixin/frozenlib.music.mixins.json"

[[mixins]]
config="mixin/frozenlib.networking.mixins.json"

[[mixins]]
config="mixin/frozenlib.particle.mixins.json"

[[mixins]]
config="mixin/frozenlib_fabricmc_datafixer.mixins.json"

[[mixins]]
config="mixin/frozenlib_quiltmc_registry.mixins.json"

[[mixins]]
config="mixin/frozenlib.registry.neoforge.mixins.json"

[[mixins]]
config="mixin/frozenlib.renderer.mixins.json"

[[mixins]]
config="mixin/frozenlib.resource.mixins.json"

[[mixins]]
config="mixin/frozenlib.screenshake.mixins.json"

[[mixins]]
config="mixin/frozenlib.sound.mixins.json"

[[mixins]]
config="mixin/frozenlib.storage.mixins.json"

[[mixins]]
config="mixin/frozenlib.tag.mixins.json"

[[mixins]]
config="mixin/frozenlib.wind.mixins.json"

[[mixins]]
config="mixin/frozenlib.wind.neoforge.mixins.json"

[[ dependencies.frozenlib ]]
    modId="neoforge"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[[ dependencies.frozenlib ]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

["lithium:options"]
"mixin.world.raycast" = false
