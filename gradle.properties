# Increases the amount of memory Gradle can use and optimizes the GC
	# -XX:+UseZGC
	org.gradle.jvmargs=-Xmx4G
# Helps with build times
	org.gradle.parallel=true
# Caches Dependencies for faster build times.
    org.gradle.caching=false

# mod properties
    mod_id=frozenlib
    mod_name=FrozenLib
    mod_author=FrozenBlock
    license=GPL-3.0
    credits=Liukrast, Xfrtrex, Soro, zhntm
    description=A multiloader library that contains many useful tools and APIs for modders.
    minecraft_version_range=[26.3, 27)
    java_version=25

# Fabric Properties
	# Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
	minecraft_version=26.3-snapshot-6
	fabric_loader_version=0.19.3
	min_fabric_loader_version=0.19.0

# Mod Properties
	mod_version = 3.0
	maven_group = net.frozenblock
	archives_base_name = FrozenLib
	repository = FrozenBlock/FrozenLib

# Publishing
	modrinth_project_id = 9KawNmQc
	curseforge_project_id = 709773

# Dependencies
	fabric_api_version=0.156.1+26.3
    fabric_kotlin_version=1.13.12+kotlin.2.4.0
    toml4j_version=0.7.2
    jankson_version=1.2.3
    xjs_data_version=0.14
    xjs_compat_version=0.13
    fresult_version=3.1

# External Mods
	modmenu_version=20.0.1
	cloth_config_version=26.2.155
