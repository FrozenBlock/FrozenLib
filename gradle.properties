# Increases the amount of memory Gradle can use and optimizes the GC
	# -XX:+UseZGC
	org.gradle.jvmargs=-Xmx4G
# Helps with build times
	org.gradle.parallel=true
# Caches Dependencies for faster build times.
    org.gradle.caching=true

# mod properties
    mod_id=frozenlib
    mod_name=FrozenLib
    mod_author=FrozenBlock
    license=GPL-3.0
    credits=Liukrast, Xfrtrex, Soro, zhntm
    description=A library that contains many tools for modders. Includes advanced math operations, noise sampling, advanced sounds, entity texture overrides, structure pool element replacements, item cooldown changes, datafixers, syncable configs, and much more!
    minecraft_version_range=[26.2, 27)
    java_version=25

# Fabric Properties
	# Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
	minecraft_version=26.2
	loader_version=0.19.3
	min_loader_version=0.19.0

# Mod Properties
	mod_version = 2.5.3
	maven_group = net.frozenblock
	archives_base_name = FrozenLib

# Dependencies
	fabric_api_version=0.152.1+26.2
    fabric_kotlin_version=1.13.12+kotlin.2.4.0
    toml4j_version=0.7.2
    jankson_version=1.2.3
    xjs_data_version=0.14
    xjs_compat_version=0.13
    fresult_version=3.1

# External Mods
	modmenu_version=19.0.0-alpha.1
	cloth_config_version=26.1.154
    terrablender_version=26.1.0.1

# NeoForge Properties (verify versions against the snapshot maven)
    neoforge_version=26.2.0.1-beta
    neo_form_version=26.2-1
    neoforge_loader_version_range=[4,)
    kotlinforforge_version=6.2.0

# ASM
    asm_version=9.10.1

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
    neoforge_snapshot_maven=
